<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prestamo - SGRSI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css?v=2">
</head>
<body data-roles="solicitante">
  <div class="wrapper">
    <nav id="sidebar">
      <div class="sidebar-header">
        <h3><i class="bi bi-hdd-stack-fill"></i> SGRSI</h3>
      </div>
      <ul id="menuRol" class="list-unstyled components" data-active="prestamo"></ul>
      <ul class="list-unstyled CTAs">
        <li><a href="#" id="btnSalir" class="btn btn-danger">Salir</a></li>
      </ul>
    </nav>

    <div id="content">
      <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
        <div class="container-fluid">
          <button type="button" id="sidebarCollapse" class="btn btn-primary">
            <i class="bi bi-list"></i>
            <span class="d-none d-md-inline-block ms-1">Menu</span>
          </button>
        </div>
      </nav>

      <main class="container-fluid">
        <section class="page-header">
          <h1 class="h3 section-title">Solicitud de prestamo</h1>
          <div class="alert alert-info mt-3">
            En esta primera entrega se valida el formulario en el frontend. La gestion real se conectara luego con PHP y MySQL.
          </div>
          <div id="mensaje"></div>
        </section>

        <form id="formPrestamo" class="card mt-3" novalidate>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Recurso solicitado</label><input id="recurso" class="form-control" required></div>
              <div class="col-md-6"><label class="form-label">Docente responsable</label><input id="docente" class="form-control" required></div>
              <div class="col-md-6"><label class="form-label" for="estudiante">Nombre del estudiante</label><input id="estudiante" class="form-control" minlength="2" maxlength="80" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]{2,80}" title="Use solo letras y espacios." required></div>
              <div class="col-md-3"><label class="form-label" for="cedulaEstudiante">Cedula del estudiante</label><input id="cedulaEstudiante" type="text" class="form-control" inputmode="numeric" maxlength="8" pattern="\d{7,8}" data-only-digits="true" title="Ingrese solo numeros, entre 7 y 8 digitos." required></div>
              <div class="col-md-3"><label class="form-label">Grupo</label><input id="actividad" class="form-control" required></div>
              <div class="col-md-4"><label class="form-label" for="fechaPrestamo">Fecha de prestamo</label><input id="fechaPrestamo" type="text" class="form-control" inputmode="numeric" placeholder="dd/mm/aaaa" pattern="\d{2}/\d{2}/\d{4}" data-date-latin="true" data-no-past="true" title="Use el formato dd/mm/aaaa." required></div>
              <div class="col-md-4"><label class="form-label" for="fechaDevolucion">Fecha de devolucion prevista</label><input id="fechaDevolucion" type="text" class="form-control" inputmode="numeric" placeholder="dd/mm/aaaa" pattern="\d{2}/\d{2}/\d{4}" data-date-latin="true" data-no-past="true" title="Use el formato dd/mm/aaaa." required></div>
              <div class="col-12"><label class="form-label">Motivo</label><textarea id="motivo" class="form-control" required></textarea></div>
              <div class="col-12"><button class="btn btn-primary">Registrar solicitud</button></div>
            </div>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js?v=8"></script>
</body>
</html>
