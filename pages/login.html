<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGRSI - Ingreso al sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css?v=2">
</head>
<body>
  <div class="login-container">
    <div class="card login-card shadow-lg">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <h1 class="h3 fw-bold" style="color: var(--sgrsi-blue);">
            <i class="bi bi-hdd-stack"></i> SGRSI
          </h1>
          <p class="text-muted">Ingreso al Sistema de Gestión</p>
        </div>

        <div id="mensaje"></div>

        <form id="formLogin" novalidate>
          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required value="admin@sgrsi.edu">
            <label for="email">Correo electrónico</label>
          </div>
          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required value="admin">
            <label for="password">Contraseña</label>
          </div>
          <div class="d-grid">
            <button class="btn btn-primary btn-lg" type="submit">Ingresar</button>
          </div>
        </form>
        <div class="text-center mt-4">
          <a href="registro.html">Crear una cuenta</a> | <a href="../index.html">Volver al inicio</a>
        </div>
        <div class="alert alert-info small mt-4">
          <h5 class="alert-heading h6">Accesos de maqueta para probar roles:</h5>
          <ul>
            <li><b>Admin:</b> admin@sgrsi.edu / admin</li>
            <li><b>Técnico:</b> tecnico@sgrsi.edu / tecnico</li>
            <li><b>Docente:</b> docente@sgrsi.edu / docente</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/js/main.js?v=8"></script>
</body>
</html>
