<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios - SGRSI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css?v=2">
</head>
<body data-roles="admin">
  <div class="wrapper">
    <nav id="sidebar">
      <div class="sidebar-header"><h3><i class="bi bi-hdd-stack-fill"></i> SGRSI</h3></div>
      <ul id="menuRol" class="list-unstyled components" data-active="usuarios"></ul>
      <ul class="list-unstyled CTAs"><li><a href="#" id="btnSalir" class="btn btn-danger">Salir</a></li></ul>
    </nav>
    <div id="content">
      <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
        <div class="container-fluid">
          <button type="button" id="sidebarCollapse" class="btn btn-primary"><i class="bi bi-list"></i><span class="d-none d-md-inline-block ms-1">Menu</span></button>
        </div>
      </nav>
      <main class="container-fluid">
        <div class="page-header">
          <h1 class="h2">Gestion de usuarios</h1>
          <p class="text-muted mb-0">Vista administrativa para controlar usuarios del sistema.</p>
        </div>
        <section class="card">
          <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <h2 class="card-title h5 mb-0">Usuarios</h2>
            <button class="btn btn-outline-secondary btn-sm" disabled>Accion disponible en proximas entregas</button>
          </div>
          <div class="card-body">
            <div class="row g-2 mb-3">
              <div class="col-md-4"><input class="form-control" placeholder="Buscar usuario" disabled></div>
              <div class="col-md-4"><select class="form-select" disabled><option>Filtrar por rol</option></select></div>
              <div class="col-md-4"><select class="form-select" disabled><option>Filtrar por estado</option></select></div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="empty-state">
              <p class="fw-bold">No hay registros cargados en esta maqueta.</p>
              <p>La informacion real se conectara en proximas entregas con PHP y MySQL.</p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js?v=8"></script>
