<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uso de sala - SGRSI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../style/styles.css?v=44" />
  </head>
  <body class="uso-sala-page" data-roles="solicitante">
    <div class="wrapper">
      <nav id="sidebar">
        <div class="sidebar-header">
          <h3><i class="bi bi-hdd-stack-fill"></i> SGRSI</h3>
        </div>
        <ul
          id="menuRol"
          class="list-unstyled components"
          data-active="uso-sala"
        ></ul>
        <ul class="list-unstyled CTAs">
          <li><a href="#" id="btnSalir" class="btn btn-danger">Salir</a></li>
        </ul>
      </nav>

      <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
          <div class="container-fluid">
            <button type="button" id="sidebarCollapse" class="btn btn-primary">
              <i class="bi bi-list"></i>
              <span class="d-none d-md-inline-block ms-1">Menú</span>
            </button>
          </div>
        </nav>

        <main class="container-fluid">
          <section class="page-header">
            <h1 class="h3 section-title">Planilla digital de uso de sala</h1>
            <div id="mensaje"></div>
          </section>

          <form id="formUsoSala" class="card mt-3" novalidate>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label" for="tipoSala">Tipo de sala</label
                  ><select id="tipoSala" class="form-select" required>
                    <option value="">Seleccionar</option>
                    <option value="Salón">Salón</option>
                    <option value="Taller">Taller</option>
                    <option value="Laboratorio">Laboratorio</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="salaSolicitada"
                    >Sala solicitada</label
                  ><select
                    id="salaSolicitada"
                    class="form-select"
                    required
                    disabled
                  >
                    <option value="">Seleccione primero un tipo de sala</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="fecha">Fecha</label>
                  <div class="input-group">
                    <input
                      id="fecha"
                      type="text"
                      class="form-control"
                      inputmode="numeric"
                      placeholder="dd/mm/aaaa"
                      pattern="\d{2}/\d{2}/\d{4}"
                      data-fecha-latina="true"
                      data-no-pasada="true"
                      title="Use el formato dd/mm/aaaa."
                      required
                    />
                    <button
                      id="btnFechaHoy"
                      type="button"
                      class="btn btn-outline-primary"
                      title="Usar la fecha de hoy"
                    >
                      <i class="bi bi-calendar-check" aria-hidden="true"></i>
                      Hoy
                    </button>
                  </div>
                </div>
                <div class="col-md-2">
                  <label class="form-label">Entrada</label
                  ><input
                    id="horaEntrada"
                    type="time"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-2">
                  <label class="form-label">Salida</label
                  ><input
                    id="horaSalida"
                    type="time"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Grupo</label
                  ><input id="grupo" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Asignatura</label
                  ><input id="asignatura" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Docente</label
                  ><input id="docente" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Turno</label
                  ><select id="turno" class="form-select" required>
                    <option>Matutino</option>
                    <option>Vespertino</option>
                    <option>Nocturno</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label" for="observaciones"
                    >Observaciones del salón</label
                  ><input id="observaciones" class="form-control" />
                </div>
                <div class="col-md-3 usage-equipment-field">
                  <label class="form-label" for="numeroEquipo"
                    >Número de equipo</label
                  ><select id="numeroEquipo" class="form-select"></select>
                </div>
                <div class="col-md-4 usage-equipment-field">
                  <label class="form-label" for="alumno"
                    >Nombre y apellido del alumno</label
                  ><input id="alumno" class="form-control" />
                </div>
                <div class="col-md-2 usage-equipment-field">
                  <label class="form-label" for="estadoEquipo"
                    >Estado del equipo</label
                  ><select id="estadoEquipo" class="form-select">
                    <option>Libre</option>
                    <option>Ocupado</option>
                  </select>
                </div>
                <div class="col-md-3 usage-equipment-field">
                  <label class="form-label" for="obsEquipo"
                    >Observaciones del equipo</label
                  ><input id="obsEquipo" class="form-control" />
                </div>
                <div class="col-12 usage-sheet-actions">
                  <button
                    id="btnAgregarAlumno"
                    type="button"
                    class="btn btn-outline-primary"
                  >
                    <i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar
                    alumno/equipo
                  </button>
                  <button
                    id="btnRegistrarUso"
                    class="btn btn-primary"
                    type="submit"
                  >
                    <i class="bi bi-check2-circle" aria-hidden="true"></i>
                    Confirmar y registrar
                  </button>
                  <button
                    id="btnImprimirUso"
                    type="button"
                    class="btn btn-outline-secondary"
                    disabled
                  >
                    <i class="bi bi-printer" aria-hidden="true"></i> Imprimir
                    planilla
                  </button>
                  <button
                    id="btnNuevaPlanilla"
                    type="button"
                    class="btn btn-outline-secondary"
                    hidden
                  >
                    <i class="bi bi-file-earmark-plus" aria-hidden="true"></i>
                    Nueva planilla
                  </button>
                </div>
              </div>
            </div>
          </form>

          <section
            id="planillaUsoSala"
            class="usage-sheet table-responsive mt-3"
          >
            <div
              id="resumenImpresionUsoSala"
              class="usage-print-summary"
              aria-hidden="true"
            ></div>
            <table class="table align-middle">
              <caption class="visually-hidden">
                Equipos y alumnos incluidos en la planilla de uso de sala
              </caption>
              <thead>
                <tr>
                  <th>Equipo</th>
                  <th>Alumno</th>
                  <th>Estado</th>
                  <th>Observaciones del equipo</th>
                  <th class="usage-row-actions">
                    <span class="visually-hidden">Acciones</span>
                  </th>
                </tr>
              </thead>
              <tbody id="tablaAlumnos"></tbody>
            </table>
          </section>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../Controlador/controlador.js?v=46"></script>
  </body>
</html>
