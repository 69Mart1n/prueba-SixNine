<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis solicitudes - SGRSI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../style/styles.css?v=22">
</head>
<body data-roles="solicitante" data-scope="mine">
  <div class="wrapper">
    <nav id="sidebar">
      <div class="sidebar-header"><h3><i class="bi bi-hdd-stack-fill"></i> SGRSI</h3></div>
      <ul id="menuRol" class="list-unstyled components" data-active="mis-solicitudes"></ul>
      <ul class="list-unstyled CTAs"><li><a href="#" id="btnSalir" class="btn btn-danger">Salir</a></li></ul>
    </nav>
    <div id="content">
      <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
        <div class="container-fluid">
          <button type="button" id="sidebarCollapse" class="btn btn-primary"><i class="bi bi-list"></i><span class="d-none d-md-inline-block ms-1">Menú</span></button>
        </div>
      </nav>
      <main class="container-fluid">
        <div class="page-header">
          <h1 class="h2">Mis solicitudes</h1>
          <p class="text-muted mb-0">Seguimiento visual de solicitudes creadas por el solicitante.</p>
        </div>
        <section class="card">
          <div class="card-header"><h2 class="card-title h5 mb-0">Estado de solicitudes</h2></div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead><tr><th>Tipo</th><th>Fecha</th><th>Detalle</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody id="tablaSolicitudes"></tbody>
              </table>
            </div>
            <div class="empty-state">
              <p class="fw-bold">No hay solicitudes disponibles.</p>
              <p>La informacion se cargara desde la base de datos.</p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../Controlador/controlador.js?v=24"></script>
</body>
</html>
