<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro - SGRSI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../style/styles.css?v=22">
</head>
<body class="auth-page registration-page">
  <div class="auth-background" aria-hidden="true"></div>

  <main class="auth-shell registration-shell">
    <a class="auth-back-link" href="../index.html">
      <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al inicio
    </a>

    <section class="auth-card registration-card" aria-labelledby="tituloRegistro">
      <div class="auth-institution-banner">
        <img src="../style/logo-anep-utu-banner.png" alt="ANEP UTU - Educación Técnico Profesional">
      </div>

      <div class="auth-form-panel registration-panel">
        <div class="auth-brand">
          <span><strong>SGRSI</strong><small>ANEP · UTU</small></span>
        </div>

        <header class="auth-heading registration-heading">
          <p class="auth-eyebrow">Registro institucional</p>
          <h1 id="tituloRegistro">Crear una cuenta</h1>
          <p>Complete sus datos para enviar la solicitud de acceso. La cuenta quedará pendiente de aprobación.</p>
        </header>

        <div id="mensaje" aria-live="polite"></div>

        <form id="formRegistro" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="nombre">Nombre</label>
              <input id="nombre" name="nombre" class="form-control" autocomplete="given-name" minlength="2" maxlength="40" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]{2,40}" title="Use solo letras y espacios." required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="apellido">Apellido</label>
              <input id="apellido" name="apellido" class="form-control" autocomplete="family-name" minlength="2" maxlength="40" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]{2,40}" title="Use solo letras y espacios." required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="cedula">Cédula de identidad</label>
              <input id="cedula" name="cedula" type="text" class="form-control" inputmode="numeric" autocomplete="off" maxlength="8" pattern="\d{7,8}" data-solo-digitos="true" title="Ingrese solo números, entre 7 y 8 dígitos." required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="telefono">Teléfono</label>
              <input id="telefono" name="telefono" type="tel" class="form-control" inputmode="numeric" autocomplete="tel" maxlength="15" pattern="\d{8,15}" data-solo-digitos="true" title="Ingrese solo números, entre 8 y 15 dígitos." required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="correo">Correo electrónico</label>
              <input id="correo" name="correo" type="email" class="form-control" autocomplete="email" maxlength="80" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="contrasena">Contraseña</label>
              <input id="contrasena" name="contrasena" type="password" class="form-control" autocomplete="new-password" minlength="8" maxlength="72" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="rolSolicitado">Rol solicitado</label>
              <select id="rolSolicitado" name="rolSolicitado" class="form-select" required>
                <option value="">Seleccionar</option>
                <option value="solicitante">Docente / Solicitante</option>
                <option value="tecnico">Técnico</option>
                <option value="administrador">Administrador / Coordinador</option>
              </select>
            </div>
            <div class="col-12 registration-actions">
              <button class="btn btn-primary btn-lg" type="submit">
                Enviar solicitud
              </button>
              <p>¿Ya tiene una cuenta? <a href="login.html">Iniciar sesión</a></p>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../Controlador/controlador.js?v=24"></script>
</body>
</html>
