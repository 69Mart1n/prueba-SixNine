<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restablecer contraseña - SGRSI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../style/styles.css?v=23">
</head>
<body class="auth-page">
  <div class="auth-background" aria-hidden="true"></div>
  <main class="auth-shell login-shell">
    <a class="auth-back-link" href="login.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al inicio de sesión</a>
    <section class="auth-card login-card" aria-labelledby="tituloRestablecimiento">
      <div class="auth-institution-banner"><img src="../style/logo-anep-utu-banner.png" alt="ANEP UTU - Educación Técnico Profesional"></div>
      <div class="auth-form-panel">
        <div class="auth-brand"><span><strong>SGRSI</strong><small>ANEP · UTU</small></span></div>
        <header class="auth-heading">
          <p class="auth-eyebrow">Acceso institucional</p>
          <h1 id="tituloRestablecimiento">Restablecer contraseña</h1>
          <p>Elija una nueva contraseña de al menos 8 caracteres.</p>
        </header>
        <div id="mensaje" aria-live="polite"></div>
        <form id="formRestablecerContrasena" novalidate>
          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Nueva contraseña" minlength="8" maxlength="72" autocomplete="new-password" required>
            <label for="contrasena">Nueva contraseña</label>
          </div>
          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="confirmarContrasena" name="confirmar_contrasena" placeholder="Confirmar contraseña" minlength="8" maxlength="72" autocomplete="new-password" required>
            <label for="confirmarContrasena">Confirmar contraseña</label>
          </div>
          <div class="d-grid"><button class="btn btn-primary btn-lg" type="submit">Guardar nueva contraseña</button></div>
        </form>
        <a id="enlaceVolverLogin" class="btn btn-outline-primary w-100 mt-3 d-none" href="login.html">Volver al inicio de sesión</a>
      </div>
    </section>
  </main>
  <script type="module" src="../../Controlador/controlador.js?v=24"></script>
</body>
</html>
