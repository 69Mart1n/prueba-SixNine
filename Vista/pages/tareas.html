<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tareas de soporte - SGRSI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../style/styles.css?v=44" />
  </head>
  <body data-roles="administrador tecnico">
    <div class="wrapper">
      <nav id="sidebar">
        <div class="sidebar-header">
          <h3><i class="bi bi-hdd-stack-fill"></i> SGRSI</h3>
        </div>
        <ul
          id="menuRol"
          class="list-unstyled components"
          data-active="tareas"
        ></ul>
        <ul class="list-unstyled CTAs">
          <li><a href="#" id="btnSalir">Cerrar sesión</a></li>
        </ul>
      </nav>
      <div id="content">
        <nav class="navbar navbar-light bg-light sticky-top">
          <div class="container-fluid">
            <button id="sidebarCollapse" class="btn btn-primary">
              <i class="bi bi-list"></i> Menú
            </button>
          </div>
        </nav>
        <main class="container-fluid">
          <header
            class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3"
          >
            <div>
              <h1 class="h2">Calendario de soporte</h1>
              <p class="text-muted mb-0">
                Tareas preventivas y reactivas con seguimiento técnico.
              </p>
            </div>
            <button
              id="btnNuevaTarea"
              class="btn btn-primary"
              data-requires-role="administrador"
            >
              <i class="bi bi-calendar-plus"></i> Programar tarea
            </button>
          </header>
          <div id="mensaje"></div>
          <section class="card">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>Programada</th>
                    <th>Tipo</th>
                    <th>Tarea</th>
                    <th>Recurso</th>
                    <th>Estado</th>
                    <th>Resultado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="tablaTareas"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
    <div class="modal fade" id="modalTarea" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <form id="formTarea" class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5">Programar tarea</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">Tipo</label
                ><select name="tipo" class="form-select">
                  <option value="preventiva">Preventiva</option>
                  <option value="reactiva">Reactiva</option>
                </select>
              </div>
              <div class="col-md-9">
                <label class="form-label">Título</label
                ><input name="titulo" class="form-control" required />
              </div>
              <div class="col-12">
                <label class="form-label">Descripción</label
                ><textarea
                  name="descripcion"
                  class="form-control"
                  required
                ></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="idEquipoTarea">Equipo</label
                ><select
                  id="idEquipoTarea"
                  name="id_equipo"
                  class="form-select"
                >
                  <option value="">Sin equipo específico</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="idEspacioTarea">Espacio</label
                ><select
                  id="idEspacioTarea"
                  name="id_espacio"
                  class="form-select"
                >
                  <option value="">Sin espacio específico</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Fecha y hora</label
                ><input
                  name="fecha_programada"
                  type="datetime-local"
                  class="form-control"
                  required
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar</button
            ><button class="btn btn-primary">Programar</button>
          </div>
        </form>
      </div>
    </div>
    <div
      class="modal fade"
      id="modalResultadoTarea"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <form id="formResultadoTarea" class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5">Completar tarea</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="id_tarea" /><label class="form-label"
              >Resultado técnico</label
            ><textarea
              name="resultado"
              class="form-control"
              rows="4"
              required
            ></textarea>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar</button
            ><button class="btn btn-success">Completar</button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../Controlador/controlador.js?v=46"></script>
  </body>
</html>
