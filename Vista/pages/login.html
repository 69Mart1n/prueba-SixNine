<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SGRSI - Ingreso al sistema</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../style/styles.css?v=55" />
  </head>
  <body class="auth-page">
    <div class="auth-background" aria-hidden="true"></div>
    <main class="auth-shell login-shell">
      <a class="auth-back-link" href="../index.html">
        <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al inicio
      </a>

      <section class="auth-card login-card" aria-labelledby="tituloIngreso">
        <div class="auth-institution-banner">
          <img
            src="../style/logo-anep-utu-banner.png"
            alt="ANEP UTU - Educacion Tecnico Profesional"
          />
        </div>

        <div class="auth-form-panel">
          <header class="auth-heading">
            <h1 id="tituloIngreso">Ingreso al sistema</h1>
            <p>Use las credenciales de su cuenta institucional.</p>
          </header>

          <div id="mensaje" aria-live="polite"></div>

          <form id="formInicioSesion" novalidate>
            <div class="auth-field mb-3">
              <input
                type="email"
                class="form-control"
                id="correo"
                name="correo"
                placeholder="usuario@sgrsi.test"
                autocomplete="username"
                required
              />
              <label for="correo">Correo electrónico</label>
            </div>
            <div class="auth-password-field mb-3">
              <div class="auth-field">
                <input
                  type="password"
                  class="form-control"
                  id="contrasena"
                  name="contrasena"
                  placeholder="Contraseña"
                  autocomplete="current-password"
                  required
                />
                <label for="contrasena">Contraseña</label>
              </div>
              <button
                type="button"
                class="auth-password-toggle"
                id="btnMostrarContrasena"
                title="Mostrar contraseña"
                aria-label="Mostrar u ocultar contraseña"
                aria-pressed="false"
              >
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
            <div class="text-end mb-3">
              <a href="recuperar-contrasena.html">¿Olvidó su contraseña?</a>
            </div>
            <div class="d-grid">
              <button class="btn btn-primary btn-lg" type="submit">
                Ingresar
              </button>
            </div>
          </form>

          <div class="auth-links">
            <a href="registro.html">Crear una cuenta</a>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="../../Controlador/controlador.js?v=46"></script>
  </body>
</html>
