<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitar rol - SGRSI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../style/styles.css?v=22">
</head>
<body data-roles="administrador tecnico solicitante">
  <div class="wrapper">
    <nav id="sidebar">
      <div class="sidebar-header"><h3><i class="bi bi-hdd-stack-fill"></i> SGRSI</h3></div>
      <ul id="menuRol" class="list-unstyled components" data-active="solicitar-rol"></ul>
      <ul class="list-unstyled CTAs"><li><a href="#" id="btnSalir" class="btn btn-danger">Salir</a></li></ul>
    </nav>
    <div id="content">
      <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
        <div class="container-fluid">
          <button type="button" id="sidebarCollapse" class="btn btn-primary"><i class="bi bi-list"></i><span class="d-none d-md-inline-block ms-1">Menu</span></button>
        </div>
      </nav>
      <main class="container-fluid">
        <section class="page-header">
          <h1 class="h3 section-title">Solicitar otro rol</h1>
          <div id="mensaje"></div>
        </section>
        <form id="formSolicitudRol" class="card mt-3" novalidate>
          <div class="card-body">
            <div class="row g-3 align-items-end">
              <div class="col-md-8">
                <label class="form-label" for="rol">Rol a solicitar</label>
                <select id="rol" name="rol" class="form-select" required>
                  <option value="">Seleccionar</option>
                  <option value="solicitante">Docente / Solicitante</option>
                  <option value="tecnico">Tecnico</option>
                  <option value="administrador">Coordinador / Administrador</option>
                </select>
              </div>
              <div class="col-md-4">
                <button class="btn btn-primary w-100">Enviar solicitud</button>
              </div>
            </div>
          </div>
        </form>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../Controlador/controlador.js?v=24"></script>
</body>
</html>
