<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Préstamos recibidos - SGRSI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../style/styles.css?v=44" />
  </head>
  <body data-roles="administrador tecnico">
    <div class="wrapper">
      <nav id="sidebar">
        <div class="sidebar-header">
          <h3><i class="bi bi-hdd-stack-fill"></i> SGRSI</h3>
        </div>
        <ul
          id="menuRol"
          class="list-unstyled components"
          data-active="prestamos"
        ></ul>
        <ul class="list-unstyled CTAs">
          <li><a href="#" id="btnSalir" class="btn btn-danger">Salir</a></li>
        </ul>
      </nav>
      <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
          <div class="container-fluid">
            <button type="button" id="sidebarCollapse" class="btn btn-primary">
              <i class="bi bi-list"></i
              ><span class="d-none d-md-inline-block ms-1">Menú</span>
            </button>
          </div>
        </nav>
        <main class="container-fluid">
          <div class="page-header">
            <h1 class="h2">Gestión de préstamos</h1>
            <p class="text-muted mb-0">
              Panel para revisar solicitudes de préstamo recibidas, devoluciones
              y estudiantes con atraso.
            </p>
          </div>
          <section class="card">
            <div
              class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center"
            >
              <h2 class="card-title h5 mb-0">Préstamos recibidos</h2>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-hover align-middle">
                  <thead>
                    <tr>
                      <th>Recurso</th>
                      <th>Estudiante</th>
                      <th>Docente asociado</th>
                      <th>Fecha préstamo</th>
                      <th>Fecha devolución</th>
                      <th>Estado</th>
                      <th>Observación</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tablaPrestamos"></tbody>
                </table>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <div
      class="modal fade"
      id="modalDevolucionPrestamo"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <form id="formDevolucionPrestamo" class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5">Registrar devolución</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="id_prestamo" />
            <label class="form-label" for="condicionDevolucion"
              >Condición del equipo</label
            >
            <select
              id="condicionDevolucion"
              name="condicion"
              class="form-select"
              required
            >
              <option value="bueno">Buen estado</option>
              <option value="observado">Requiere revisión</option>
              <option value="dañado">Dañado / fuera de servicio</option>
            </select>
            <label class="form-label mt-3" for="observacionesDevolucion"
              >Observaciones</label
            >
            <textarea
              id="observacionesDevolucion"
              name="observaciones"
              class="form-control"
              rows="3"
            ></textarea>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar</button
            ><button class="btn btn-success" type="submit">
              <i class="bi bi-check2-circle"></i> Registrar devolución
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../Controlador/controlador.js?v=46"></script>
  </body>
</html>
