<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Historial - SGRSI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../style/styles.css?v=44" />
  </head>
  <body data-roles="administrador">
    <div class="wrapper">
      <nav id="sidebar">
        <div class="sidebar-header">
          <h3><i class="bi bi-hdd-stack-fill"></i> SGRSI</h3>
        </div>
        <ul
          id="menuRol"
          class="list-unstyled components"
          data-active="historial"
        ></ul>
        <ul class="list-unstyled CTAs">
          <li><a href="#" id="btnSalir">Cerrar sesión</a></li>
        </ul>
      </nav>
      <div id="content">
        <nav class="navbar navbar-light bg-light sticky-top">
          <div class="container-fluid">
            <button id="sidebarCollapse" class="btn btn-primary">
              <i class="bi bi-list"></i> Menú
            </button>
          </div>
        </nav>
        <main class="container-fluid">
          <header class="page-header">
            <h1 class="h2">Historial del sistema</h1>
            <p class="text-muted mb-0">
              Trazabilidad de acciones administrativas y operativas sin exponer
              identidades responsables.
            </p>
          </header>
          <div id="mensaje"></div>
          <section class="card">
            <div class="card-header"><h2 class="h5 mb-0">Auditoría</h2></div>
            <div class="card-body">
              <div class="row g-2 mb-3">
                <div class="col-md-4">
                  <select id="filtroModuloHistorial" class="form-select">
                    <option value="">Todos los módulos</option>
                    <option value="usuarios">Usuarios</option>
                    <option value="inventario">Inventario</option>
                    <option value="incidencias">Incidencias</option>
                    <option value="prestamos">Préstamos</option>
                    <option value="solicitudes">Solicitudes</option>
                    <option value="tareas">Tareas</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <input
                    id="historialDesde"
                    type="date"
                    class="form-control"
                    aria-label="Desde"
                  />
                </div>
                <div class="col-md-3">
                  <input
                    id="historialHasta"
                    type="date"
                    class="form-control"
                    aria-label="Hasta"
                  />
                </div>
                <div class="col-md-2">
                  <button
                    id="btnFiltrarHistorial"
                    class="btn btn-outline-primary w-100"
                  >
                    <i class="bi bi-funnel"></i> Filtrar
                  </button>
                </div>
              </div>
              <div class="table-responsive">
                <table class="table table-hover align-middle">
                  <thead>
                    <tr>
                      <th>Fecha</th>
                      <th>Módulo</th>
                      <th>Acción</th>
                      <th>Entidad</th>
                      <th>Cambios</th>
                    </tr>
                  </thead>
                  <tbody id="tablaHistorial"></tbody>
                </table>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../Controlador/controlador.js?v=46"></script>
  </body>
</html>
