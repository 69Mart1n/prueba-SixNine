<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket de incidencia - SGRSI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../style/styles.css?v=22">
</head>
<body data-roles="solicitante">
  <div class="wrapper">
    <nav id="sidebar">
      <div class="sidebar-header">
        <h3><i class="bi bi-hdd-stack-fill"></i> SGRSI</h3>
      </div>
      <ul id="menuRol" class="list-unstyled components" data-active="incidencia"></ul>
      <ul class="list-unstyled CTAs">
        <li><a href="#" id="btnSalir" class="btn btn-danger">Salir</a></li>
      </ul>
    </nav>

    <div id="content">
      <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
        <div class="container-fluid">
          <button type="button" id="sidebarCollapse" class="btn btn-primary">
            <i class="bi bi-list"></i>
            <span class="d-none d-md-inline-block ms-1">Menú</span>
          </button>
        </div>
      </nav>

      <main class="container-fluid">
        <section class="page-header">
          <h1 class="h3 section-title">Crear ticket de incidencia</h1>
          <div id="mensaje"></div>
        </section>

        <form id="formTicket" class="card mt-3" novalidate>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Titulo</label><input id="titulo" class="form-control" required></div>
              <div class="col-md-3"><label class="form-label" for="idCategoriaIncidencia">Categoría</label><select id="idCategoriaIncidencia" class="form-select" required><option value="">Cargando categorías...</option></select></div>
              <div class="col-md-3"><label class="form-label" for="idEspacioIncidencia">Espacio</label><select id="idEspacioIncidencia" class="form-select"><option value="">Sin espacio específico</option></select></div>
              <div class="col-md-3"><label class="form-label" for="idEquipoIncidencia">Equipo afectado</label><select id="idEquipoIncidencia" class="form-select"><option value="">Sin equipo específico</option></select></div>
              <div class="col-md-3"><label class="form-label" for="fechaReportada">Fecha reportada</label><input id="fechaReportada" type="date" class="form-control" data-solo-hoy="true" title="Seleccione la fecha actual del reporte." required></div>
              <div class="col-12"><label class="form-label">Descripción</label><textarea id="descripcion" class="form-control" rows="4" required></textarea></div>
              <div class="col-12"><button class="btn btn-primary">Crear ticket</button></div>
            </div>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../Controlador/controlador.js?v=24"></script>
</body>
</html>
