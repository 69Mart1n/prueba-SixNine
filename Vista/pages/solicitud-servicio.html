<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solicitud de servicio - SGRSI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../style/styles.css?v=44" />
  </head>
  <body data-roles="solicitante">
    <div class="wrapper">
      <nav id="sidebar">
        <div class="sidebar-header">
          <h3><i class="bi bi-hdd-stack-fill"></i> SGRSI</h3>
        </div>
        <ul
          id="menuRol"
          class="list-unstyled components"
          data-active="laboratorio"
        ></ul>
        <ul class="list-unstyled CTAs">
          <li><a href="#" id="btnSalir" class="btn btn-danger">Salir</a></li>
        </ul>
      </nav>

      <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
          <div class="container-fluid">
            <button type="button" id="sidebarCollapse" class="btn btn-primary">
              <i class="bi bi-list"></i>
              <span class="d-none d-md-inline-block ms-1">Menú</span>
            </button>
          </div>
        </nav>

        <main class="container-fluid">
          <section class="page-header">
            <h1 class="h3 section-title">Solicitud de sala o servicio</h1>
            <div id="mensaje"></div>
          </section>

          <form id="formSolicitud" class="card mt-3" novalidate>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label" for="tipoSolicitud"
                    >Tipo de solicitud</label
                  ><select id="tipoSolicitud" class="form-select" required>
                    <option value="">Seleccionar</option>
                    <option>Reserva de sala</option>
                    <option>Instalación de software</option>
                    <option>Soporte para clase</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="tipoSala">Tipo de sala</label
                  ><select id="tipoSala" class="form-select" required>
                    <option value="">Seleccionar</option>
                    <option value="Salón">Salón</option>
                    <option value="Taller">Taller</option>
                    <option value="Laboratorio">Laboratorio</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="salaSolicitada"
                    >Sala solicitada</label
                  ><select
                    id="salaSolicitada"
                    class="form-select"
                    required
                    disabled
                  >
                    <option value="">Seleccione primero un tipo de sala</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="fechaSolicitada"
                    >Fecha solicitada</label
                  ><input
                    id="fechaSolicitada"
                    type="text"
                    class="form-control"
                    inputmode="numeric"
                    placeholder="dd/mm/aaaa"
                    pattern="\d{2}/\d{2}/\d{4}"
                    data-fecha-latina="true"
                    data-no-pasada="true"
                    title="Use el formato dd/mm/aaaa."
                    required
                  />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Turno</label
                  ><select id="turno" class="form-select" required>
                    <option>Matutino</option>
                    <option>Vespertino</option>
                    <option>Nocturno</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Grupo</label
                  ><input id="grupo" class="form-control" required />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Asignatura</label
                  ><input id="asignatura" class="form-control" required />
                </div>
                <div id="campoSoftware" class="col-md-3" hidden>
                  <label class="form-label" for="software"
                    >Software requerido</label
                  ><input id="software" class="form-control" />
                </div>
                <div class="col-12">
                  <label class="form-label">Descripción</label
                  ><textarea
                    id="descripcion"
                    class="form-control"
                    required
                  ></textarea>
                </div>
                <div class="col-12">
                  <button class="btn btn-primary">Enviar solicitud</button>
                </div>
              </div>
            </div>
          </form>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../Controlador/controlador.js?v=46"></script>
  </body>
</html>
